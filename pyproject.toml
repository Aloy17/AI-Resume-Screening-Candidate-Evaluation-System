[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening-system"
version = "0.1.0"
description = "ATS-readable PDF resume screening and candidate ranking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pymupdf>=1.24", "sentence-transformers>=3.0", "torch>=2.2", "PyYAML>=6.0"]

[project.scripts]
resume-screen = "src.resume_screening.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
