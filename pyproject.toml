[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening"
version = "0.1.0"
description = "AI resume screening and candidate evaluation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf",
    "sentence-transformers",
    "numpy",
    "pyyaml",
]


[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
resume-screening = "resume_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
